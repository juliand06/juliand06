<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="230">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.35" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      fill: #93c5fd;
      letter-spacing: 0.4px;
    }
    .pill-text {
      font-family: 'Fira Code', 'Cascadia Code', Consolas, monospace;
      font-size: 11.5px;
      font-weight: 600;
      fill: #e0f2fe;
      letter-spacing: 0.6px;
    }
    .pill-bg {
      fill: #1e293b;
      fill-opacity: 0.75;
      stroke: #38bdf8;
      stroke-width: 1;
      stroke-opacity: 0.45;
      rx: 12;
    }
  </style>

  <!-- Main Rounded Background -->
  <rect width="900" height="230" rx="14" fill="url(#bgGrad)" />
  <rect width="900" height="230" rx="14" fill="url(#grid)" />

  <!-- Decorative Glow Circles -->
  <circle cx="110" cy="45" r="95" fill="#2563eb" fill-opacity="0.14" />
  <circle cx="790" cy="60" r="110" fill="#0ea5e9" fill-opacity="0.14" />

  <!-- Animated Waves -->
  <path fill="url(#waveGrad1)" d="M0,175 Q225,135 450,175 T900,165 L900,230 L0,230 Z">
    <animate attributeName="d" dur="12s" repeatCount="indefinite"
      values="M0,175 Q225,135 450,175 T900,165 L900,230 L0,230 Z;
              M0,165 Q225,200 450,160 T900,180 L900,230 L0,230 Z;
              M0,175 Q225,135 450,175 T900,165 L900,230 L0,230 Z" />
  </path>

  <path fill="url(#waveGrad2)" d="M0,190 Q225,220 450,185 T900,195 L900,230 L0,230 Z">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="M0,190 Q225,220 450,185 T900,195 L900,230 L0,230 Z;
              M0,198 Q225,160 450,195 T900,175 L900,230 L0,230 Z;
              M0,190 Q225,220 450,185 T900,195 L900,230 L0,230 Z" />
  </path>

  <!-- Subtle Border -->
  <rect x="1" y="1" width="898" height="228" rx="13" fill="none" stroke="#38bdf8" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Header Name & Subtitle -->
  <text x="450" y="74" text-anchor="middle" class="title">Andrey Julián Ricaurte Duran</text>
  <rect x="250" y="90" width="400" height="2" fill="url(#accentLine)" />
  <text x="450" y="118" text-anchor="middle" class="subtitle">Desarrollador de Software  |  Backend &amp; Frontend  |  Arquitectura &amp; SQL</text>

  <!-- Tech Stack Pills -->
  <g transform="translate(152, 142)">
    <rect x="0" y="0" width="82" height="26" class="pill-bg" />
    <text x="41" y="17" text-anchor="middle" class="pill-text">☕ JAVA</text>

    <rect x="94" y="0" width="98" height="26" class="pill-bg" />
    <text x="143" y="17" text-anchor="middle" class="pill-text">🐍 PYTHON</text>

    <rect x="204" y="0" width="124" height="26" class="pill-bg" />
    <text x="266" y="17" text-anchor="middle" class="pill-text">⚡ JAVASCRIPT</text>

    <rect x="340" y="0" width="128" height="26" class="pill-bg" />
    <text x="404" y="17" text-anchor="middle" class="pill-text">🐘 POSTGRESQL</text>

    <rect x="480" y="0" width="116" height="26" class="pill-bg" />
    <text x="538" y="17" text-anchor="middle" class="pill-text">🏛️ DDD / SOLID</text>
  </g>
</svg>
